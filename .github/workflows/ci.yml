name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile everything
        run: python -m py_compile main.py main_human.py main_hitl.py run_app.py iam_agent/*.py tests/*.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
