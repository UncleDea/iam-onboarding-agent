<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — IAM</title>
<style>
body { font-family: system-ui, sans-serif; margin: 2em auto; max-width: 900px; padding: 0 1em; color: #222; }
nav { border-bottom: 1px solid #ccc; padding-bottom: 0.5em; margin-bottom: 1.5em; }
nav a { margin-right: 0.8em; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ddd; padding: 0.4em 0.6em; text-align: left; }
th { background: #f0f0f0; }
label { display: block; margin: 0.6em 0; }
input { padding: 0.3em; }
button { padding: 0.4em 1em; cursor: pointer; }
.error { color: #b00020; }
pre { background: #f6f6f6; padding: 1em; overflow-x: auto; }
</style>
</head>
<body>
<nav>{{nav}}</nav>
<h1>{{title}}</h1>
{{body}}
</body>
</html>
